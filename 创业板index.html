<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网格交易计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #ffffff;
            padding: 16px;
            font-size: 16px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }
        .label {
            font-size: 18px;
            color: #222;
        }
        .input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-minus, .btn-plus {
            width: 36px;
            height: 36px;
            font-size: 22px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="number"] {
            width: 140px;
            text-align: center;
            font-size: 18px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .link-text {
            color: #0066cc;
            padding:16px 0;
            cursor:pointer;
        }
        .big-red-btn {
            width: 100%;
            background-color: #e61b1b;
            color: white;
            border: none;
            padding:18px;
            font-size:24px;
            border-radius:8px;
            margin:20px 0;
            cursor:pointer;
        }
        .result-box{
            background:#fff;
            border:1px solid #eee;
            padding:16px;
            border-radius:8px;
        }
        .result-title{
            font-size:18px;
            font-weight:bold;
            margin-bottom:16px;
            border-left:4px solid #e61b1b;
            padding-left:10px;
        }
        .result-item{
            padding:10px 0;
            font-size:17px;
        }
        .btns-row{
            display:flex;
            gap:12px;
            margin-top:24px;
        }
        .btn-orange{
            flex:1;
            background:#ff6600;
            color:#fff;
            border:none;
            padding:16px;
            font-size:20px;
            border-radius:8px;
            cursor:pointer;
        }
        .btn-red{
            flex:1;
            background:#e61b1b;
            color:#fff;
            border:none;
            padding:16px;
            font-size:20px;
            border-radius:8px;
            cursor:pointer;
        }
        .risk-tip{
            margin-top:20px;
            padding:12px;
            background:#fff8e8;
            border-radius:8px;
            color:#884400;
            font-size:14px;
        }
        select{
            font-size:18px;
            padding:8px;
            border:1px solid #ddd;
            border-radius:6px;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="label">网格品种</div>
        <select id="variety">
            <option value="cyb50">创业板50ETF景顺</option>
            <!-- 后续可以自行在这里增加更多品种 -->
        </select>
    </div>

    <div class="row">
        <div class="label">投入总资金</div>
        <div class="input-wrap">
            <button class="btn-minus" id="fundMinus">−</button>
            <input type="number" id="totalFund" value="100000">
            <button class="btn-plus" id="fundPlus">+</button>
        </div>
    </div>

    <div class="row">
        <div class="label">已有持仓（可选）</div>
        <div style="color:#888">点此可把已有持仓算入网格 ></div>
    </div>

    <div class="link-text">加仓网格，该如何操作？</div>

    <button class="big-red-btn" id="calcBtn">重新计算</button>

    <div class="result-box">
        <div class="result-title">计算结果。可点击下方按钮抄作业！</div>
        <div class="result-item">网格名称：<span id="gridName">-</span></div>
        <div class="result-item">价格区间：<span id="priceRange">-</span></div>
        <div class="result-item">交易条件：<div id="tradeCond"></div></div>
        <div class="result-item">触发基准价：<span id="basePrice">-</span></div>

        <div class="btns-row">
            <button class="btn-orange">建网格底仓</button>
            <button class="btn-red">挂网格条件单</button>
        </div>
    </div>

    <div class="risk-tip">
        ⚠️风险提示：本计算器仅为个人策略复盘测算工具，不构成任何投资建议，市场有风险，投资需谨慎，请审慎决策。
    </div>

<script>
// 加减按钮
const totalFund = document.getElementById('totalFund');
document.getElementById('fundMinus').onclick = ()=>{
    let v = Number(totalFund.value);
    if(v>0) totalFund.value = v - 10000;
}
document.getElementById('fundPlus').onclick = ()=>{
    let v = Number(totalFund.value);
    totalFund.value = v + 10000;
}

document.getElementById('calcBtn').onclick = function(){
    // 这里示例参数，你后面可以改成真实网格公式
    const fund = Number(totalFund.value);
    document.getElementById('gridName').innerText = "创业板50ETF景顺网格";
    document.getElementById('priceRange').innerText = "0.857元 ~ 1.401元";
    document.getElementById('tradeCond').innerHTML = `
        <div style="margin:4px 0">上涨+2.77%，再回落‑0.5%，触发卖出6308元</div>
        <div style="margin:4px 0">下跌‑2.7%，再反弹+0.4%，触发买入6308元</div>
    `;
    document.getElementById('basePrice').innerText = "1.077元，需再买底仓51800股";
}
</script>
</body>
</html>
